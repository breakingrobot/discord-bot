# cargo-deny (`mise run deny`) : failles connues, licences, doublons et sources des dépendances Rust.
# Documentation : https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Base RustSec : une faille connue ou un crate retiré bloque, un crate non maintenu avertit.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Une licence autorisée mais absente du graphe n'est pas une erreur.
unused-allowed-license = "allow"
# Le bot lui-même (`publish = false`) n'a pas de licence à vérifier.
private = { ignore = true }
# Licences permissives uniquement (le binaire est distribué en image Docker).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  "CC0-1.0",
  "OpenSSL",
]

[bans]
# Plusieurs versions d'un même crate : signalé, pas bloquant (fréquent via les dépendances).
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Uniquement crates.io : pas de dépendance git ni de registre inconnu.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
